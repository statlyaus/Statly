name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: 'file:./ci-test.db'
      DATABASE_URL_TEST: 'file:./ci-test.db'
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Run full test suite
        run: npm run test:all

      - name: Upload coverage (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/**
            coverage/unit/**
          if-no-files-found: ignore

  # Optional: comment a concise status on the PR
  pr-status:
    if: github.event_name == 'pull_request'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const conclusion = "${{ needs.build-and-test.result }}";
            const ok = conclusion === "success";
            const body = ok
              ? "✅ CI passed. Ready to review/merge."
              : "❌ CI failed. Please check logs in the CI run.";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
