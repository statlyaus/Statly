name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: 'file:./ci-test.db'
      DATABASE_URL_TEST: 'file:./ci-test.db'
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Run full test suite
        run: npm run test:all

      - name: Upload coverage (if produced)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: |
            coverage/**
            coverage/unit/**
          if-no-files-found: ignore

  # Optional: comment a concise status on the PR
  pr-status:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const conclusion = "${{ needs.build-and-test.result }}";
            const ok = conclusion === "success";
            const body = ok
              ? "✅ CI passed. Ready to review/merge."
              : "❌ CI failed. Please check logs in the CI run.";
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            } catch (error) {
              core.warning(`Unable to post CI status comment: ${error.message}`);
            }
