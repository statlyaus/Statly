name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run only the suites their changed files can affect; pushes to main and manual runs
  # run everything. Scripts/ci/changed-suites.mjs owns the rules and CI Gate below checks every skip
  # against them. See docs/development/testing.md, "Path-filtered jobs".
  changes:
    name: Changed suites
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      root: ${{ steps.classify.outputs.root }}
      fantasy_app: ${{ steps.classify.outputs.fantasy_app }}
      outcomes: ${{ steps.classify.outputs.outcomes }}
      etl: ${{ steps.classify.outputs.etl }}
      functions: ${{ steps.classify.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The script has no dependencies, so the runner's own Node.js is enough and no install runs.
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            node Scripts/ci/changed-suites.mjs --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull_request run checks out the merge commit. Its first parent is the base branch tip,
          # so this is the pull request's diff against the base it would merge into.
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            echo "Expected the pull request merge commit to have two parents." >&2
            exit 1
          fi
          git diff --name-only -z 'HEAD^1' HEAD | node Scripts/ci/changed-suites.mjs | tee -a "$GITHUB_OUTPUT"

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run skills:check
      - run: npm run docs:check

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run typecheck:tests

  functions:
    name: Functions
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:compiled

  etl:
    name: ETL
    needs: changes
    if: ${{ needs.changes.outputs.etl == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: etl/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:compiled
      - name: Build pinned AFL trade capture runtime
        run: docker build --tag statly-afl-trade-capture:ci --file afl-trade-intelligence/Dockerfile afl-trade-intelligence
      - name: Verify offline fitzRoy decoder contract
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --entrypoint Rscript statly-afl-trade-capture:ci
          --vanilla /opt/statly/capture/test_decode_contract.R

  outcomes-postgres:
    name: AFL outcomes PostgreSQL (shard ${{ matrix.shard }}/4)
    needs: changes
    if: ${{ needs.changes.outputs.outcomes == 'true' }}
    runs-on: ubuntu-latest
    # tests/testUtils/outcomesShardSequencer.ts splits the files by measured duration. See
    # docs/development/testing.md before changing the count.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        # Each suite schema holds the complete ordered migration history, about 1,200 relations, and
        # DROP SCHEMA ... CASCADE has to lock every one of them. The image default of 64 locks fails
        # that teardown with "out of shared memory" once suites run in parallel.
        # The database is disposable, so durability is switched off: every suite replays about 250
        # migration transactions and fsync on the runner disk was a large share of that time.
        command: >-
          -c max_locks_per_transaction=2048
          -c fsync=off
          -c synchronous_commit=off
          -c full_page_writes=off
        env:
          POSTGRES_DB: statly_outcomes_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_outcomes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      AFL_OUTCOMES_TEST_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_outcomes_test
      AFL_OUTCOMES_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_outcomes_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate isolated outcomes schema
        run: npm run outcomes:prisma:validate
      - name: Generate isolated outcomes client
        run: npm run outcomes:prisma:generate
      - name: Resolve disposable PostgreSQL service container
        shell: bash
        run: |
          mapfile -t container_ids < <(
            docker ps --no-trunc \
              --filter "ancestor=postgres:16-alpine" \
              --filter "publish=5432" \
              --format '{{.ID}}'
          )
          if [[ ${#container_ids[@]} -ne 1 || ! ${container_ids[0]} =~ ^[a-f0-9]{64}$ ]]; then
            echo "Expected one immutable PostgreSQL service container ID; found ${#container_ids[@]}." >&2
            exit 1
          fi
          echo "AFL_OUTCOMES_TEST_CONTAINER_ID=${container_ids[0]}" >> "$GITHUB_ENV"
      - name: PostgreSQL integration tests
        run: npm run test:outcomes:int:provisioned -- --shard=${{ matrix.shard }}/4

  # Unit, integration and browser tests are separate jobs so that "Re-run failed jobs" repeats only
  # the tier that failed. See docs/development/delivery.md, "Re-running CI".
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    # Vitest assigns files to shards by a hash of their path, not by duration. Three shards put all
    # three native-PAV files in one shard and were no faster than two. See docs/development/testing.md.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statly_fantasy_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_fantasy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DATABASE_URL_TEST: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'false'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate disposable test database
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm run test:unit -- --shard=${{ matrix.shard }}/2

  integration-tests:
    name: Integration tests
    needs: changes
    if: ${{ needs.changes.outputs.fantasy_app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statly_fantasy_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_fantasy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DATABASE_URL_TEST: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'false'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate disposable test database
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm run test:int

  browser-tests:
    name: Browser tests
    needs: changes
    if: ${{ needs.changes.outputs.fantasy_app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statly_fantasy_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_fantasy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DATABASE_URL_TEST: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'false'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers for cross-browser smoke coverage
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Migrate disposable test database
        run: npx prisma migrate deploy
      - name: Browser tests
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  draft-worker-e2e:
    name: Draft worker E2E
    needs: changes
    if: ${{ needs.changes.outputs.fantasy_app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statly_fantasy_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_fantasy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DATABASE_URL_TEST: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'true'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for draft worker coverage
        run: npx playwright install --with-deps chromium
      - name: Migrate disposable draft worker database
        run: npx prisma migrate deploy
      - name: Draft worker browser tests
        run: npm run test:e2e:draft-worker
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-worker-test-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      DIRECT_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_fantasy_test
      FIREBASE_ADMIN_DISABLED: 'true'
      NEXT_PHASE: phase-production-build
      REDIS_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-ci
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - documentation
      - lint
      - typecheck
      - functions
      - etl
      - outcomes-postgres
      - unit-tests
      - integration-tests
      - browser-tests
      - draft-worker-e2e
      - build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A job passes on success, or on a skip that the changes job's output for its suite allowed. A
      # failed or cancelled job, a needed job that was skipped, or a failed classification fails the
      # gate. Keep this job-to-suite map in step with the jobs' `if:` conditions; a job missing from
      # it must always succeed.
      - name: Require every needed validation job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq --raw-output '
            {
              "lint": "root", "typecheck": "root", "unit-tests": "root", "build": "root",
              "integration-tests": "fantasy_app", "browser-tests": "fantasy_app",
              "draft-worker-e2e": "fantasy_app",
              "outcomes-postgres": "outcomes", "etl": "etl", "functions": "functions"
            } as $suite
            | .changes.outputs as $needed
            | to_entries[]
            | select(
                (.value.result == "success"
                  or (.key != "changes" and .value.result == "skipped"
                    and $suite[.key] != null and $needed[$suite[.key]] == "false"))
                | not)
            | "\(.key): \(.value.result)"
          ' <<<"$NEEDS_JSON")
          if [[ -n "$failures" ]]; then
            printf 'Needed jobs that did not succeed:\n%s\n' "$failures" >&2
            exit 1
          fi
