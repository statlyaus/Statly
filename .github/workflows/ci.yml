name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        if: github.event_name == 'push'
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Env check (Firebase)
        run: npm run env:check:firebase

      - name: Guard Next route runtimes
        run: npm run guard:routes

      - name: Guard module boundaries
        run: npm run guard:deps

      - name: Run tests
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Run build
        run: npm run build

      - name: Secret leak guard (bundles + sourcemaps)
        run: npm run guard:secrets

      - name: Verify Next.js build outputs exist
        run: |
          test -d .next/static || (echo "Missing .next/static" && exit 1)
          test -d .next/standalone || (echo "Missing .next/standalone (ensure next.config output: 'standalone')" && exit 1)
          test -d .next/server || (echo "Missing .next/server" && exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifact
          path: |
            .next/static
            .next/standalone
            .next/server
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifact
          path: .

      - name: Deploy to Production
        run: echo "Add your deployment commands here" # e.g., firebase deploy, vercel deploy, etc.
