name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-typecheck.db
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck

  functions:
    name: Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:compiled

  etl:
    name: ETL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: etl/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:compiled
      - name: Build pinned AFL trade capture runtime
        run: docker build --tag statly-afl-trade-capture:ci --file afl-trade-intelligence/Dockerfile afl-trade-intelligence
      - name: Verify offline fitzRoy decoder contract
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --entrypoint Rscript statly-afl-trade-capture:ci
          --vanilla /opt/statly/capture/test_decode_contract.R

  outcomes-postgres:
    name: AFL outcomes PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statly_outcomes_test
          POSTGRES_USER: statly_test
          POSTGRES_PASSWORD: statly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statly_test -d statly_outcomes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      AFL_OUTCOMES_TEST_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_outcomes_test
      AFL_OUTCOMES_DATABASE_URL: postgresql://statly_test:statly_test@localhost:5432/statly_outcomes_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate isolated outcomes schema
        run: npm run outcomes:prisma:validate
      - name: Generate isolated outcomes client
        run: npm run outcomes:prisma:generate
      - name: PostgreSQL integration tests
        run: npm run test:outcomes:int

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: file:./ci-test.db
      DATABASE_URL_TEST: file:./ci-test.db
      REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'false'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers for cross-browser smoke coverage
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Migrate disposable test database
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:int
      - name: Browser tests
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-artifacts
          path: |
            coverage/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  draft-worker-e2e:
    name: Draft worker E2E
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: file:./ci-draft-worker.db
      DATABASE_URL_TEST: file:./ci-draft-worker.db
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      PLAYWRIGHT_WITH_SOCKET: 'true'
      PLAYWRIGHT_WITH_DRAFT_WORKER: 'true'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-e2e
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for draft worker coverage
        run: npx playwright install --with-deps chromium
      - name: Migrate disposable draft worker database
        run: npx prisma migrate deploy
      - name: Draft worker browser tests
        run: npm run test:e2e:draft-worker
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: draft-worker-test-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-build.db
      FIREBASE_ADMIN_DISABLED: 'true'
      NEXT_PHASE: phase-production-build
      REDIS_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: statly-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: statly-ci
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - documentation
      - lint
      - typecheck
      - functions
      - etl
      - outcomes-postgres
      - tests
      - draft-worker-e2e
      - build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
