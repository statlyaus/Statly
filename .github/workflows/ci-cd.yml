name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify Firebase env vars
        run: |
          [ -n "${FIREBASE_PROJECT_ID}" ] || { echo "FIREBASE_PROJECT_ID is required"; exit 1; }
          [ -n "${FIREBASE_CLIENT_EMAIL}" ] || { echo "FIREBASE_CLIENT_EMAIL is required"; exit 1; }
          [ -n "${FIREBASE_PRIVATE_KEY}" ] || { echo "FIREBASE_PRIVATE_KEY is required"; exit 1; }
      - run: npm run build
      - run: npm run lint

  deploy:
    # needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Verify Firebase env vars
        run: |
          [ -n "${FIREBASE_PROJECT_ID}" ] || { echo "FIREBASE_PROJECT_ID is required"; exit 1; }
          [ -n "${FIREBASE_CLIENT_EMAIL}" ] || { echo "FIREBASE_CLIENT_EMAIL is required"; exit 1; }
          [ -n "${FIREBASE_PRIVATE_KEY}" ] || { echo "FIREBASE_PRIVATE_KEY is required"; exit 1; }
      - run: npm run build:production
      # Add your deployment steps here, e.g., deploy to Vercel, AWS, etc.
