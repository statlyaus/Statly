version: 2

updates:
  # Security alerts alone leave advisories unactioned, so dependency updates are requested
  # weekly and grouped to keep the review surface small. Major versions are ignored everywhere:
  # each one is a deliberate ticket, not a pull request that sits failing in the queue. The ignore
  # rule covers version updates only, so security updates still open for majors.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patch:
        dependency-type: production
        update-types:
          - patch

  # The Firebase Functions and ETL trees are independent npm projects with their own lockfiles that
  # CI installs separately, so they need their own update entries.
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /etl
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
