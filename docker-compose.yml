version: '3.9'

services:
  web:
    image: node:20
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${WEB_PORT:-3000}:3000'
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - socket

  socket:
    image: node:20
    working_dir: /app
    command: sh -c "npm ci && npm run dev:socket"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${SOCKET_PORT:-3002}:3002'
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data

volumes:
  redisdata:
