version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: statly-postgres-test
    environment:
      POSTGRES_USER: statly
      POSTGRES_PASSWORD: statly
      POSTGRES_DB: statly_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U statly -d statly_test" ]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: statly-redis-test
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata_test:
