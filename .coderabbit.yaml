# Configuration for development teams
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "wip"
      - "draft"

  tools:
    eslint:
      enabled: true
      path_filters:
        exclude:
          - "node_modules/**"
          - "vendor/**"
          - "build/**"
          - "dist/**"
          - ".venv/**"
          - ".next/**"
          - "out/**"
    ruff:
      enabled: true
      path_filters:
        exclude:
          - "node_modules/**"
          - "vendor/**"
          - "build/**"
          - "dist/**"
          - ".venv/**"
          - "__pycache__/**"
    gitleaks:
      enabled: true
      path_filters:
        exclude:
          - "node_modules/**"
          - "vendor/**"
          - "build/**"
          - "dist/**"
          - ".venv/**"
          - ".next/**"
          - "out/**"
    hadolint:
      enabled: true
      path_filters:
        exclude:
          - "node_modules/**"
          - "vendor/**"
          - "build/**"
          - "dist/**"
          - ".venv/**"
    yamllint:
      enabled: true
      path_filters:
        exclude:
          - "node_modules/**"
          - "vendor/**"
          - "build/**"
          - "dist/**"
          - ".venv/**"


chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"