# Configuration for development teams
language: 'en-US'

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    # GitHub draft PRs are skipped by `drafts: false`; a title keyword of 'draft' also skipped every
    # draft-room PR.
    ignore_title_keywords:
      - 'wip'

  tools:
    eslint:
      enabled: true
      path_filters:
        exclude:
          - 'node_modules/**'
          - 'vendor/**'
          - 'build/**'
          - 'dist/**'
          - '.venv/**'
          - '.next/**'
          - 'out/**'
    gitleaks:
      enabled: true
      path_filters:
        exclude:
          - 'node_modules/**'
          - 'vendor/**'
          - 'build/**'
          - 'dist/**'
          - '.venv/**'
          - '.next/**'
          - 'out/**'
    hadolint:
      enabled: true
      path_filters:
        exclude:
          - 'node_modules/**'
          - 'vendor/**'
          - 'build/**'
          - 'dist/**'
          - '.venv/**'
    yamllint:
      enabled: true
      path_filters:
        exclude:
          - 'node_modules/**'
          - 'vendor/**'
          - 'build/**'
          - 'dist/**'
          - '.venv/**'

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
      - '**/AGENTS.md'
