<!DOCTYPE html>
<html>
<head>
    <title>Add Test Data to Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0051cc; }
        .result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Firebase Test Data Manager</h1>
    
    <h2>Add Test Data</h2>
    <button onclick="addTestData()">Add Sample Player Stats to Firebase</button>
    
    <h2>Check Current Data</h2>
    <button onclick="checkPlayerStats()">Check Player Stats API</button>
    
    <div id="result" class="result"></div>

    <script>
        async function addTestData() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Adding test data...';
            
            try {
                const response = await fetch('/api/add-test-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Success! Added ${result.count} player stats:\n\n${JSON.stringify(result, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Error: ${result.error}\n\nDetails: ${result.details}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Network Error: ${error.message}`;
            }
        }
        
        async function checkPlayerStats() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Checking player stats...';
            
            try {
                const response = await fetch('/api/player-stats?season=2025');
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Found ${result.count} player stats:\n\n${JSON.stringify(result, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Error: ${result.error}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Network Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
