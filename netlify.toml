[build]
  command = "npm run build:production"
  publish = ".next"
  # Production deploys are rationed: each costs 15 of the plan's monthly credits and main takes dozens
  # of merges a week. Exit 0 cancels the build a merge to main starts; deploy previews and branch
  # deploys still build. Production is deployed by .github/workflows/deploy-production.yml through a
  # build hook, which this command cannot cancel.
  ignore = 'test "$CONTEXT" = production'

[build.environment]
  NODE_VERSION = "22"
  # The build needs devDependencies (cross-env, TypeScript, Tailwind, Prisma). The production
  # environment sets NODE_ENV=production, which makes npm skip them unless told otherwise.
  NPM_FLAGS = "--include=dev"
  # Type-checking the app needs more than Node's default 2 GB heap (the first build died there).
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/:probe/wp-includes/*"
  to = "/not-found.txt"
  status = 404
  force = true
