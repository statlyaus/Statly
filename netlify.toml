[build]
  command = "npm run build:production"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The build needs devDependencies (cross-env, TypeScript, Tailwind, Prisma). The production
  # environment sets NODE_ENV=production, which makes npm skip them unless told otherwise.
  # `.npmrc` (include=dev) is the primary guard; this flag is kept as a fallback.
  NPM_FLAGS = "--include=dev"
  # Type-checking the app needs more than Node's default 2 GB heap (the first build died there).
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/:probe/wp-includes/*"
  to = "/not-found.txt"
  status = 404
  force = true
