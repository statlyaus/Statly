connectorId: 'default'
## Configure SDK generation so the codegen can output a typed JS SDK
generate:
  javascriptSdk:
    outputDir: ../../src/lib/dataconnect/generated
    package: "@statly/dataconnect"
    packageJsonDir: ../../
  # Uncomment other platforms as needed
  # swiftSdk:
  #   outputDir: <Path where you want the generated SDK to be written to, relative to this file>
  #   package: DefaultConnector
  # kotlinSdk:
  #   outputDir: <Path where you want the generated SDK to be written to, relative to this file>
  #   package: connectors.default
  # dartSdk:
  #   outputDir: <Path where you want the generated SDK to be written to, relative to this file>
  #   package: default_connector
